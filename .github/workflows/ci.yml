name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  # a caller of v1's contract: no new inputs, no actions: read
  compat:
    uses: govengers/.github/.github/workflows/go-service.yml@test/go-service-perm-probe
    with:
      image: ghcr.io/${{ github.repository }}
      full: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

  featured:
    uses: govengers/.github/.github/workflows/go-service.yml@feat/go-service-v2
    with:
      image: ghcr.io/${{ github.repository }}
      bun-version: "1.3.3"
      recipes: '["probe-env", "lint"]'
      budget-warm-seconds: 10
      budget-cold-seconds: 10
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
